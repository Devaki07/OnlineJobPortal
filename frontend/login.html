<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Online Job Portal</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav>

        <h2>
            <i class="fa-solid fa-briefcase"></i>
            Online Job Portal
        </h2>

        <ul>

            <li>
                <a href="index.html">
                    <i class="fa-solid fa-house"></i>
                    Home
                </a>
            </li>

            <li>
                <a href="jobs.html">
                    <i class="fa-solid fa-briefcase"></i>
                    Jobs
                </a>
            </li>

            <li>
                <a href="login.html">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Login
                </a>
            </li>

            <li>
                <a href="register.html">
                    <i class="fa-solid fa-user-plus"></i>
                    Register
                </a>
            </li>

        </ul>

    </nav>


    <!-- =========================
         LOGIN FORM
    ========================== -->

    <main class="form-container">

        <h2>
            <i class="fa-solid fa-right-to-bracket"></i>
            Login
        </h2>

        <p>
            Login to your account to apply for jobs.
        </p>


        <form id="loginForm">

            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    <i class="fa-solid fa-envelope"></i>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    <i class="fa-solid fa-lock"></i>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- Login button -->

            <button type="submit">

                <i class="fa-solid fa-right-to-bracket"></i>
                Login

            </button>

        </form>


        <!-- Message -->

        <div id="message"></div>


        <!-- Register -->

        <p style="margin-top: 20px;">

            Don't have an account?

            <a href="register.html">
                Register here
            </a>

        </p>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 Online Job Portal.
            All rights reserved.
        </p>

    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        const API_URL = "http://localhost:8080";


        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const message =
                        document
                            .getElementById("message");


                    message.className = "";
                    message.textContent = "";


                    try {

                        const response =
                            await fetch(
                                `${API_URL}/login`,
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            email: email,
                                            password: password
                                        })
                                }
                            );


                        const data =
                            await response.json();


                        if (response.ok &&
                            data.success) {


                            /*
                             * Store only the
                             * required login
                             * information.
                             *
                             * Password is NOT
                             * stored in localStorage.
                             */

                            localStorage.setItem(
                                "loggedInEmail",
                                data.user.email
                            );

                            localStorage.setItem(
                                "loggedInName",
                                data.user.name
                            );

                            localStorage.setItem(
                                "loggedInRole",
                                data.user.role
                            );

                            localStorage.setItem(
                                "loggedInUserId",
                                data.user.id
                            );


                            message.className =
                                "message success";

                            message.textContent =
                                "Login successful! Redirecting...";


                            setTimeout(
                                function () {

                                    window.location.href =
                                        "jobs.html";

                                },
                                800
                            );


                        } else {

                            message.className =
                                "message error";

                            message.textContent =
                                data.message ||
                                "Invalid email or password.";

                        }


                    } catch (error) {

                        console.error(error);

                        message.className =
                            "message error";

                        message.textContent =
                            "Unable to connect to the server. Please try again.";

                    }

                }
            );

    </script>

</body>

</html>
